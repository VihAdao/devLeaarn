<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-Lab</title>
    <link rel="stylesheet" href="./estilos/cadastro.css">
    <script src="cadastro.js"></script>
</head>

<body>
    <header class="header">
        <a href="landing-page.html" class="logo">Task-LAB</a>

        <nav class="menu">
            <a href="login.html" class="menuPrincipalItem">Login</a>
            <a href="cadastro.html" class="menuPrincipalItem">Cadastro</a>
            <a href="sobre.html" class="menuPrincipalItem">Sobre nós</a>
        </nav> 

    </header>

    <h1 class="titulo">Cadastre-se no Task-LAB</h1>

    <div class="container-cadastro"> 
       <div class="cadastro-form">
            <form method="post" target="_self">
                <label for="userNome">Nome</label><br>
                <input type="text" id="userNome" name="userNome" placeholder="Digite seu nome" required><br><br><br>
                <label for="userEmail">Email</label><br>
                <input type="email" id="userEmail" name="userEmail" placeholder="Digite seu email" required><br><br><br>
                <label for="userSenha">Senha</label><br>
                <input type="password" id="userSenha" name="userSenha" placeholder="Digite sua senha" required><br><br><br>
                <label for="userConfSenha">Confirme a senha</label><br>
                <input type="password" id="userConfSenha" name="userConfSenha" placeholder="Digite sua senha" required><br>

                <div class="botao">
                    <button type="submit" class="botao-cadastro">Cadastrar</button>
                </div>
                
            </form>

        </div> 
    </div>
    
    <div class="login">
        <a href="login.html">Já tem uma conta? Entrar</a>
    </div>
    

    <footer class="footer">
        <h3 class="logo-footer">Task-LAB</h3>

        <div>
            <p style="font-weight: bold;">Desenvolvido por: </p>
            <ul class="lista-devs">
                <li><a href="https://github.com/luishvarela">Luis Henrique Varela</a></li>
                <li><a href="https://github.com/malickfs">Malick Figueroa Sanó</a></li>
                <li><a href="https://github.com/FV-MariaRita">Maria Rita Vargas</a></li>
                <li><a href="https://github.com/VihAdao">Victor Hugo Adão</a></li>
            </ul>
        </div>
    </footer>

    <script type="module" src="cadastro.js"></script>

</body>
</html>
