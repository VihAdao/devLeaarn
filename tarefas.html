<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task-LAB | Tarefas</title>

    <link rel="stylesheet" href="./estilos/tarefas.css">
    <script type="module" src="app/cards.js" defer></script>
</head>

<body>
    <header class="header">
        <a href="principal.html" class="logo">Task-LAB</a>
    </header>

    <div class="dashboard">

        <div class="menu-lateral">
            <a href="principal.html">🏠 Início</a>
            <a href="tarefas.html" class="pagina-atual">📝 Tarefas</a>
            <a href="calendario.html">📆 Calendário</a>
            <a href="landing-page.html">Sair</a>
        </div>

        <main class="conteudo">

            <h1 class="titulo">Minhas tarefas</h1>

            <h3 class="subtitulo">
                Organize suas atividades e acompanhe o que precisa ser feito.
            </h3>

            <section class="resumo-tarefas">

                <div class="resumo-card">
                    <span id="total-tarefas" class="numero-resumo"></span>
                    <span>Total de tarefas</span>
                </div>

                <div class="resumo-card">
                    <span id="tarefas-pendentes" class="numero-resumo"></span>
                    <span>Pendentes</span>
                </div>

                <div class="resumo-card">
                    <span id="tarefas-concluidas" class="numero-resumo"></span>
                    <span>Concluídas</span>
                </div>

                <div class="resumo-card">
                    <span id="tarefas-hoje" class="numero-resumo"></span>
                    <span>Para hoje</span>
                </div>

            </section>

            <section class="nova-tarefa">

                <h2>Adicionar nova tarefa</h2>

                <form id="form-tarefa">

                    <div class="campo campo-titulo">
                        <label for="input-tarefa">Título</label>

                        <input
                            type="text"
                            id="input-tarefa"
                            placeholder="Digite o título da tarefa"
                            required
                        >
                    </div>

                    <div class="campo campo-descricao">
                        <label for="descricao-tarefa">Descrição</label>

                        <input
                            type="text"
                            id="descricao-tarefa"
                            placeholder="Digite uma descrição"
                        >
                    </div>

                    <div class="campo">
                        <label for="prioridade-tarefa">Prioridade</label>

                        <select id="prioridade-tarefa">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="data-tarefa">Prazo</label>

                        <input
                            type="date"
                            id="data-tarefa"
                        >
                    </div>

                    <button type="submit" class="botao-adicionar">
                        Adicionar tarefa
                    </button>

                </form>

            </section>

            <section class="filtros">

                <input
                    type="search"
                    id="buscar-tarefa"
                    placeholder="Buscar tarefa"
                >

                <select id="filtro-status">
                    <option value="">Todos os status</option>
                    <option value="A Fazer">Pendentes</option>
                    <option value="Concluída">Concluídas</option>
                </select>

                <select id="filtro-prioridade">
                    <option value="">Todas as prioridades</option>
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                </select>

            </section>

            <section class="lista-tarefas">

                <h2>Lista de tarefas</h2>

                <div id="container-cards"></div>

            </section>

        </main>

    </div>
    <!--<script type="module" src="app/firebase.js"></script>-->
    <script type="module" src="app/cards.js" defer></script>

</body>
</html>
