<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task-LAB | Tarefas</title>

    <link rel="stylesheet" href="./estilos/calendario.css">
</head>

<body>
    <header class="header">
        <a href="principal.html" class="logo">Task-LAB</a>
    </header>

    <div class="dashboard">

        <div class="menu-lateral">
            <a href="principal.html">🏠 Início</a>
            <a href="tarefas.html">📝 Tarefas</a>
            <a href="calendario.html" class="pagina-atual">📆 Calendário</a>
            <a href="perfil.html">👤 Perfil</a>
            <a href="landing-page.html">Sair</a>
        </div>

        <main class="conteudo">

            <h1 class="titulo">Meu calendário</h1>

            <h3 class="subtitulo">
                Visualize prazos, eventos e tarefas do mês.
            </h3>

            <section class="resumo-tarefas">
                <div class="card-resumo-tarefas">
                    <p class="numero-eventos-resumo" id="eventos-mes">0</p>
                    <p>Eventos no mês</p>
                </div>
                <div class="card-resumo-tarefas">
                    <p class="numero-eventos-resumo" id="eventos-hoje">0</p>
                    <p>Hoje</p>
                </div>
                <div class="card-resumo-tarefas">
                    <p class="numero-eventos-resumo" id="proximos-prazos">0</p>    
                    <p>Próximos prazos</p>
                </div>
                <div class="card-resumo-tarefas">
                    <p class="numero-eventos-resumo" id="eventos-concluidos">0</p>
                    <p>Concluídos</p>
                </div>
            </section>

            <section class="calendario-info">
                <div class="navegacao-calendario">
                    <button type="button" id="mes-anterior">Anterior</button>
                    <button type="button" id="mes-proximo">Próximo</button>
                    <button type="button" id="botao-hoje">Hoje</button>
                </div>

                <div id="mes-atual">
                    <p id="titulo-mes"></p>
                </div>
            </section>

            <section class="calendario">
                <div class="container-dias-semana">
                    <div class="dias-semana"> <p>Domingo</p> </div>
                    <div class="dias-semana"> <p>Segunda</p> </div>
                    <div class="dias-semana"> <p>Terça</p> </div>
                    <div class="dias-semana"> <p>Quarta</p> </div>
                    <div class="dias-semana"> <p>Quinta</p> </div>
                    <div class="dias-semana"> <p>Sexta</p> </div>
                    <div class="dias-semana"> <p>Sábado</p> </div>
                </div>
                <div class="container-calendario">
                    <div class="calendario-dias" id="calendario-dias"></div>
                </div>
            </section>

        </main>

    </div>
    <script type="module" src="./app/calendario.js"></script>
</body>
</html>
