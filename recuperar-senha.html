    <h1 class="titulo">Recupere sua senha</h1>

    <div class="container-senha"> 
       <div class="senha-form">
            <form method="post" target="_self">
                <label for="userEmail">Email</label><br>
                <input type="email" id="userEmail" name="userEmail" placeholder="Digite seu email" required><br><br><br>
                <label for="userNovaSenha">Nova senha</label><br>
                <input type="password" id="userNovaSenha" name="userNovaSenha" placeholder="Digite sua senha" required><br><br><br>
                <label for="userConfNovaSenha">Confirme a nova senha</label><br>
                <input type="password" id="userConfNovaSenha" name="userConfNovaSenha" placeholder="Digite sua senha" required><br>

                <div class="botao">
                    <button type="submit" class="botao-senha">Alterar senha</button>
                </div>
                
            </form>

            <a href="login.html">Cancelar</a>
        </div> 
    </div>
